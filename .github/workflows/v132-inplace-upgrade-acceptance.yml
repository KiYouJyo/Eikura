name: Eikura v1.3.2 in-place upgrade acceptance

on:
  push:
    branches:
      - main
    paths:
      - "scripts/Test-EikuraV132InPlaceUpgrade.ps1"
      - ".github/workflows/v132-inplace-upgrade-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eikura-v132-inplace-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    name: Upgrade Eizo 1.3.1 to Eikura 1.3.2 and retain user data
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run real signed-package upgrade acceptance
        shell: pwsh
        run: ./scripts/Test-EikuraV132InPlaceUpgrade.ps1
