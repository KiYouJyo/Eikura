name: Repository validation

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localization:
    name: Validate localization resources
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release and About-page version contract
        shell: pwsh
        run: ./scripts/Test-ReleaseVersionContract.ps1

      - name: Validate RESW key parity
        shell: pwsh
        run: ./scripts/Test-Localization.ps1

      - name: Validate navigation pane theme contract
        shell: pwsh
        run: ./scripts/Test-NavigationPaneThemeContract.ps1

      - name: Validate navigation information architecture
        shell: pwsh
        run: ./scripts/Test-NavigationInformationArchitecture.ps1

      - name: Validate cache system contract
        shell: pwsh
        run: ./scripts/Test-CacheSystemContract.ps1

      - name: Validate Eizo 0.5.0 media model contract
        shell: pwsh
        run: ./scripts/Test-MediaModelStage1Contract.ps1

      - name: Validate Eizo 0.5.1 TMDB core contract
        shell: pwsh
        run: ./scripts/Test-TmdbCoreStage2Contract.ps1

      - name: Validate Eizo 0.5.2 TMDB season contract
        shell: pwsh
        run: ./scripts/Test-TmdbSeasonStage2Contract.ps1

      - name: Validate Eizo 0.5.3 TMDB details contract
        shell: pwsh
        run: ./scripts/Test-TmdbDetailsStage2Contract.ps1

      - name: Validate Eizo 0.5.4 Provider Router contract
        shell: pwsh
        run: ./scripts/Test-ProviderRouterStage3Contract.ps1

      - name: Validate Eizo 0.5.5 field-level merge contract
        shell: pwsh
        run: ./scripts/Test-FieldMergeStage3Contract.ps1

      - name: Validate Eizo 0.5.6 merge profiles contract
        shell: pwsh
        run: ./scripts/Test-MergeProfilesStage3Contract.ps1

      - name: Validate Eizo 0.5.7 identity binding contract
        shell: pwsh
        run: ./scripts/Test-IdentityBindingStage4Contract.ps1

      - name: Validate Eizo 0.5.8 scan pipeline contract
        shell: pwsh
        run: ./scripts/Test-ScanPipelineStage5Contract.ps1

      - name: Validate Eizo 0.5.9 real-content UI contract
        shell: pwsh
        run: ./scripts/Test-RealContentUiV059Contract.ps1

      - name: Validate Eizo 0.5.10 real-content presentation contract
        shell: pwsh
        run: ./scripts/Test-RealContentPresentationV0510Contract.ps1

      - name: Validate Eizo 0.5.11 per-title metadata contract
        shell: pwsh
        run: ./scripts/Test-PerTitleMetadataV0511Contract.ps1

      - name: Validate Eizo 0.5.12 real-content UI close-out contract
        shell: pwsh
        run: ./scripts/Test-RealContentUiCloseoutV0512Contract.ps1

      - name: Validate Eizo 0.5.13 TMDB production integration contract
        shell: pwsh
        run: ./scripts/Test-TmdbProductionIntegrationV0513Contract.ps1

      - name: Validate Eizo 0.5.14 scraping architecture contract
        shell: pwsh
        run: ./scripts/Test-ScrapingArchitectureV0514Contract.ps1

      - name: Validate Bangumi public integration contract
        shell: pwsh
        run: ./scripts/Test-BangumiPublicIntegration.ps1

      - name: Validate Bangumi account integration contract
        shell: pwsh
        run: ./scripts/Test-BangumiAccountIntegration.ps1

      - name: Validate Bangumi community integration contract
        shell: pwsh
        run: ./scripts/Test-BangumiCommunityIntegration.ps1

      - name: Validate Bangumi OAuth relay and activation
        shell: pwsh
        run: ./scripts/Test-BangumiOAuthIntegration.ps1

      - name: Validate WebDAV Stage 1 media-source contract
        shell: pwsh
        run: ./scripts/Test-MediaSourceStage1Contract.ps1

      - name: Run WebDAV v0.3.0 runtime probe
        shell: pwsh
        run: |
          ./scripts/Restore-EizoMetadata.ps1
          dotnet run --project tools/Eizo.WebDavV030Probe/Eizo.WebDavV030Probe.csproj --configuration Release

      - name: Validate WebDAV v0.3.1 source management
        shell: pwsh
        run: ./scripts/Test-WebDavSourceManagementContract.ps1

      - name: Validate Metadata scan lifecycle and diagnostics contract
        shell: pwsh
        run: ./scripts/Test-MetadataScanLifecycleContract.ps1

      - name: Validate Eizo 1.0 first-run guide contract
        shell: pwsh
        run: ./scripts/Test-FirstRunGuideV100Contract.ps1

      - name: Validate library aggregation visual UI contract
        shell: pwsh
        run: ./scripts/Test-LibraryAggregationUiContract.ps1

      - name: Validate Eizo 1.2 unified card UI contract
        shell: pwsh
        run: ./scripts/Test-CardUiV120Contract.ps1

      - name: Validate Eizo 1.2.1 manual video single-file cache contract
        shell: pwsh
        run: ./scripts/Test-ManualVideoSingleFileV121Contract.ps1

      - name: Validate player/source UI cleanup contract
        shell: pwsh
        run: ./scripts/Test-PlayerUiCleanupContract.ps1

      - name: Validate Eikura 1.3.2 brand migration contract
        shell: pwsh
        run: ./scripts/Test-EikuraBrandV132Contract.ps1

      - name: Validate Eikura 1.3.2 upgrade compatibility contract
        shell: pwsh
        run: ./scripts/Test-EikuraUpgradeCompatibilityV132Contract.ps1

      - name: Validate Eizo 1.3 player interaction contract
        shell: pwsh
        run: ./scripts/Test-PlayerInteractionV130Contract.ps1

      - name: Validate Eizo 1.3 home/player queue UX contract
        shell: pwsh
        run: ./scripts/Test-PlaybackQueueUxV130Contract.ps1

  recognition-integration:
    name: Validate Recognition integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare local package source for subtitle tests
        run: mkdir -p .packages/Eizo.Playback

      - name: Run subtitle parser tests
        run: dotnet test tests/Eizo.Subtitle.Tests/Eizo.Subtitle.Tests.csproj --configuration Release

      - name: Restore pinned Eizo.Metadata package
        shell: pwsh
        run: ./scripts/Restore-EizoMetadata.ps1

      - name: Run Recognition integration tests
        run: dotnet test tests/Eizo.RecognitionIntegration.Tests/Eizo.RecognitionIntegration.Tests.csproj --configuration Release

      - name: Run Metadata integration tests
        run: dotnet test tests/Eizo.MetadataIntegration.Tests/Eizo.MetadataIntegration.Tests.csproj --configuration Release

      - name: Run media model tests
        run: dotnet test tests/Eizo.Media.Tests/Eizo.Media.Tests.csproj --configuration Release

      - name: Run cache integration tests
        run: dotnet test tests/Eizo.Cache.Tests/Eizo.Cache.Tests.csproj --configuration Release

      - name: Run Bangumi integration tests
        run: dotnet test tests/Eizo.Bangumi.Tests/Eizo.Bangumi.Tests.csproj --configuration Release

  winui-build:
    name: Build WinUI 3 app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore pinned Eizo.Playback packages
        shell: pwsh
        run: ./scripts/Restore-EizoPlayback.ps1

      - name: Restore pinned Eizo.Metadata source
        shell: pwsh
        run: ./scripts/Restore-EizoMetadata.ps1

      - name: Restore and build
        shell: pwsh
        run: >
          msbuild src\Eizo.App\Eizo.App.csproj
          /restore
          /m
          /p:Configuration=Debug
          /p:Platform=x64
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=false
