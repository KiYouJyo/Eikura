name: Eikura v1.3.2 legacy updater bridge

on:
  push:
    branches:
      - main
    paths:
      - "scripts/Reconcile-EikuraV132LegacyUpdaterBridge.ps1"
      - ".github/workflows/v132-legacy-updater-bridge.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: eikura-v132-legacy-updater-bridge
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile v1.3.2 asset name for Eizo 1.3.1 updater
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconcile never-downloaded v1.3.2 release
        shell: pwsh
        run: ./scripts/Reconcile-EikuraV132LegacyUpdaterBridge.ps1
