name: Eikura v1.3.3 infinite-scroll acceptance

on:
  push:
    branches:
      - "release/v1.3.3"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate Eikura 1.3.3 / 1.3.3.0 UX and compatibility contract
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release/version contract
        shell: pwsh
        run: ./scripts/Test-ReleaseVersionContract.ps1

      - name: Validate Eikura 1.3.3 UX contract
        shell: pwsh
        run: ./scripts/Test-EikuraBrandV133Contract.ps1
