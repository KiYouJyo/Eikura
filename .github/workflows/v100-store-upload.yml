name: Eikura Microsoft StoreUpload
# v1.3.4 dual-channel Store package (final)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v100-store-upload.yml"
      - "scripts/Build-EikuraStoreUpload.ps1"
      - "release/MicrosoftStore/store-identity.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eikura-store-upload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store-upload:
    name: Build x64 Microsoft Store upload
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve current release version
        shell: pwsh
        run: |
          $release = Get-Content -LiteralPath release/release.json -Raw | ConvertFrom-Json
          $version = [string]$release.product.version
          $packageVersion = [string]$release.product.packageVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $packageVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw 'Invalid release metadata.'
          }
          "EIKURA_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EIKURA_PACKAGE_VERSION=$packageVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "STORE_OUTPUT_DIR=$env:RUNNER_TEMP\Eikura-v$version-store-upload" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "STORE_ARTIFACT_NAME=Eikura-v$version-store-upload" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and deep-verify StoreUpload
        shell: pwsh
        run: ./scripts/Build-EikuraStoreUpload.ps1

      - name: Verify expected StoreUpload filename
        shell: pwsh
        run: |
          $expected = Join-Path $env:STORE_OUTPUT_DIR "Eikura_$($env:EIKURA_PACKAGE_VERSION)_x64.msixupload"
          if (-not (Test-Path -LiteralPath $expected -PathType Leaf)) {
            throw "Expected Store upload file was not produced: $expected"
          }
          $hash = (Get-FileHash -LiteralPath $expected -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "StoreUpload ready: $expected"
          Write-Host "SHA256: $hash"

      - name: Upload Microsoft Store submission package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.STORE_ARTIFACT_NAME }}
          path: |
            ${{ env.STORE_OUTPUT_DIR }}/*
          if-no-files-found: error
          retention-days: 14
