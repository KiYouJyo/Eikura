name: Eikura Microsoft StoreUpload
# v1.3.4 dual-channel Store package (final)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v100-store-upload.yml"
      - "scripts/Build-EikuraStoreUpload.ps1"
      - "release/MicrosoftStore/store-identity.json"
  workflow_dispatch:
    inputs:
      submit:
        description: Upload the validated package and submit it for Microsoft certification
        type: boolean
        default: false
      publication_confirmation:
        description: Type PUBLISH followed by the current product version
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: eikura-store-upload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  store-upload:
    name: Build x64 Microsoft Store upload
    runs-on: windows-2025-vs2026
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve current release version
        shell: pwsh
        run: |
          $release = Get-Content -LiteralPath release/release.json -Raw | ConvertFrom-Json
          $version = [string]$release.product.version
          $packageVersion = [string]$release.product.packageVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $packageVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw 'Invalid release metadata.'
          }
          "EIKURA_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EIKURA_PACKAGE_VERSION=$packageVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "STORE_OUTPUT_DIR=$env:RUNNER_TEMP\Eikura-v$version-store-upload" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "STORE_ARTIFACT_NAME=Eikura-v$version-store-upload" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate Store submission authorization
        if: inputs.submit
        shell: pwsh
        env:
          PUBLICATION_CONFIRMATION: ${{ inputs.publication_confirmation }}
        run: |
          if ($env:PUBLICATION_CONFIRMATION -cne "PUBLISH $env:EIKURA_VERSION") {
            throw 'Store publication confirmation does not match the current release version.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and deep-verify StoreUpload
        shell: pwsh
        run: ./scripts/Build-EikuraStoreUpload.ps1

      - name: Verify expected StoreUpload filename
        shell: pwsh
        run: |
          $expected = Join-Path $env:STORE_OUTPUT_DIR "Eikura_$($env:EIKURA_PACKAGE_VERSION)_x64.msixupload"
          if (-not (Test-Path -LiteralPath $expected -PathType Leaf)) {
            throw "Expected Store upload file was not produced: $expected"
          }
          $hash = (Get-FileHash -LiteralPath $expected -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "StoreUpload ready: $expected"
          Write-Host "SHA256: $hash"

      - name: Upload Microsoft Store submission package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.STORE_ARTIFACT_NAME }}
          path: |
            ${{ env.STORE_OUTPUT_DIR }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Setup Microsoft Store Developer CLI
        if: inputs.submit
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Store CLI and verify product identity
        if: inputs.submit
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @('reconfigure', '--tenantId', $env:TENANT_ID.Trim(), '--sellerId', $env:SELLER_ID.Trim(), '--clientId', $env:CLIENT_ID.Trim(), '--clientSecret', $env:CLIENT_SECRET)
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store CLI configuration failed.' }
          msstore settings --enableTelemetry false
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store CLI settings failed.' }
          $productJson = msstore apps get 9N1PTDCCND8S | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store product access failed.' }
          $product = $productJson | ConvertFrom-Json
          if ($product.Id -cne '9N1PTDCCND8S' -or $product.PackageIdentityName -cne 'JoKiy.Eizo' -or
              $product.PublisherName -cne 'CN=C4E4B33A-7B77-4121-897C-7D720A5471F8') {
            throw 'Microsoft Store product identity mismatch.'
          }
          if ($product.PendingApplicationSubmission) {
            throw "An existing Store submission must finish before publishing: $($product.PendingApplicationSubmission.Id)"
          }
          "LAST_PUBLISHED_SUBMISSION_ID=$($product.LastPublishedApplicationSubmission.Id)" >> $env:GITHUB_ENV

      - name: Submit validated package for Microsoft certification
        if: inputs.submit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Match PageArc's isolated upload directory: include only this verified package.
          $publishRoot = Join-Path $env:RUNNER_TEMP 'eikura-store-publish'
          $publishLeaf = Join-Path $publishRoot 'candidate'
          New-Item -ItemType Directory -Path $publishLeaf -Force | Out-Null
          $packagePath = Join-Path $env:STORE_OUTPUT_DIR "Eikura_$($env:EIKURA_PACKAGE_VERSION)_x64.msixupload"
          Copy-Item -LiteralPath $packagePath -Destination $publishLeaf
          msstore publish "$env:GITHUB_WORKSPACE" --inputDirectory "$publishRoot" --appId 9N1PTDCCND8S --uploadTimeout 1800
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store submission failed: $LASTEXITCODE" }

      - name: Verify committed Store submission
        if: inputs.submit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $statusText = msstore submission status 9N1PTDCCND8S | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Store submission status.' }
          Write-Host $statusText
          if ($statusText -match 'Submission Status\s*=\s*(Draft|.*Failed)') {
            throw 'Store submission was not successfully committed for certification.'
          }
          $productJson = msstore apps get 9N1PTDCCND8S | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the submitted Store product.' }
          $product = $productJson | ConvertFrom-Json
          $submissionId = [string]$product.PendingApplicationSubmission.Id
          if ([string]::IsNullOrWhiteSpace($submissionId)) {
            $submissionId = [string]$product.LastPublishedApplicationSubmission.Id
          }
          if ([string]::IsNullOrWhiteSpace($submissionId) -or $submissionId -eq $env:LAST_PUBLISHED_SUBMISSION_ID) {
            throw 'No new committed Store submission was found.'
          }
          Write-Host "Committed Microsoft Store submission: $submissionId"
          "## Eikura Microsoft Store submission" >> $env:GITHUB_STEP_SUMMARY
          "- Source commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "- Package version: $env:EIKURA_PACKAGE_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "- Product: 9N1PTDCCND8S / JoKiy.Eizo" >> $env:GITHUB_STEP_SUMMARY
          "- Submission ID: $submissionId" >> $env:GITHUB_STEP_SUMMARY
          "- Certification submission requested: true" >> $env:GITHUB_STEP_SUMMARY
          $statusText >> $env:GITHUB_STEP_SUMMARY
