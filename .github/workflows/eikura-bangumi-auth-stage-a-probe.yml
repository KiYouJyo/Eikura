name: Eikura Bangumi OAuth Stage A Probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eikura-bangumi-auth-stage-a-probe.yml

permissions:
  contents: read

concurrency:
  group: eikura-bangumi-auth-stage-a-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Deploy staged relay and verify credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BANGUMI_CLIENT_SECRET: ${{ secrets.BANGUMI_CLIENT_SECRET }}
      WORKER_DIR: cloudflare/eikura-bangumi-auth
      WORKER_ORIGIN: https://eikura-bangumi-auth.x2425618950.workers.dev
      WORKER_HEALTH_URL: https://eikura-bangumi-auth.x2425618950.workers.dev/health
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BANGUMI_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/eikura-bangumi-auth/package-lock.json

      - name: Install Wrangler
        working-directory: ${{ env.WORKER_DIR }}
        run: npm ci

      - name: Force staged rollout configuration
        shell: bash
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          const raw = fs.readFileSync(path, 'utf8');
          const next = raw.replace(/"OAUTH_ROLLOUT_ENABLED"\s*:\s*"(?:true|false)"/, '"OAUTH_ROLLOUT_ENABLED": "false"');
          fs.writeFileSync(path, next);
          NODE
          grep -n 'OAUTH_ROLLOUT_ENABLED' wrangler.jsonc

      - name: Deploy staged Worker
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Configure Bangumi client secret
        shell: bash
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          set -euo pipefail
          printf '%s' "$BANGUMI_CLIENT_SECRET" | npx wrangler secret put BANGUMI_CLIENT_SECRET --config wrangler.jsonc

      - name: Redeploy after secret configuration
        working-directory: ${{ env.WORKER_DIR }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify staged Worker health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' "$WORKER_HEALTH_URL" || true)"
            body="$(cat "$response_file" 2>/dev/null || true)"
            rm -f "$response_file"
            echo "health attempt $attempt: HTTP $status / $body"
            if [ "$status" = "503" ] && [ "$body" = "unavailable" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Expected staged Worker health to be HTTP 503 / unavailable." >&2
          exit 1

      - name: Verify staged login is blocked
        shell: bash
        run: |
          set -euo pipefail
          state='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          challenge='bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' "$WORKER_ORIGIN/login?state=$state&challenge=$challenge" || true)"
          body="$(cat "$response_file" 2>/dev/null || true)"
          rm -f "$response_file"
          echo "staged login probe: HTTP $status / $body"
          if [ "$status" != "503" ] || [ "$body" != "OAuth relay is not configured." ]; then
            echo "Staged relay unexpectedly accepted an OAuth login request." >&2
            exit 1
          fi

# Temporary self-trigger probe; remove after Stage A verification.
