name: Stage 7 playback integration

on:
  push:
    branches:
      - main
    paths:
      - "eng/Eizo.Playback.json"
      - "NuGet.config"
      - "scripts/Restore-EizoPlayback.ps1"
      - "src/Eizo.App/**"
      - ".github/workflows/stage7-playback-integration.yml"
  pull_request:
    paths:
      - "eng/Eizo.Playback.json"
      - "NuGet.config"
      - "scripts/Restore-EizoPlayback.ps1"
      - "src/Eizo.App/**"
      - ".github/workflows/stage7-playback-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 35

    steps:
      - name: Checkout Eizo
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore pinned Eizo.Playback packages
        shell: pwsh
        run: ./scripts/Restore-EizoPlayback.ps1

      - name: Restore pinned Eizo.Metadata source
        shell: pwsh
        run: ./scripts/Restore-EizoMetadata.ps1

      - name: Restore and compile Eizo
        shell: pwsh
        run: |
          msbuild src\Eizo.App\Eizo.App.csproj /restore /m /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=false
          if ($LASTEXITCODE -ne 0) { throw "Eizo playback integration build failed: $LASTEXITCODE" }

      - name: Verify playback dependency boundary
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem src\Eizo.App\bin\x64\Release -Recurse -File -ErrorAction SilentlyContinue)
          $expectedManaged = @(
            'Eizo.Playback.Abstractions.dll',
            'Eizo.Playback.Core.dll',
            'Eizo.Playback.LibVLC.dll',
            'Eizo.Playback.LibVLC.WinUI.dll'
          )

          foreach ($name in $expectedManaged) {
            if (-not ($assets | Where-Object Name -eq $name | Select-Object -First 1)) {
              throw "Playback integration output is missing $name"
            }
          }

          foreach ($name in @('libvlc.dll', 'libvlccore.dll')) {
            if (-not ($assets | Where-Object Name -eq $name | Select-Object -First 1)) {
              throw "Playback native runtime output is missing $name"
            }
          }

          $pluginDlls = @($assets | Where-Object {
            $_.Extension -eq '.dll' -and
            $_.FullName -match '[\\/]plugins[\\/]'
          })

          if ($pluginDlls.Count -eq 0) {
            throw 'Playback native runtime output does not contain LibVLC plugins.'
          }

          Write-Host "Managed playback assemblies PASS: $($expectedManaged.Count)"
          Write-Host "LibVLC plugin DLLs PASS: $($pluginDlls.Count)"

      - name: Build unsigned playback integration MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'Eizo-Playback-AppPackages'

          msbuild src\Eizo.App\Eizo.App.csproj /restore /m /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "Playback integration MSIX build failed: $LASTEXITCODE" }

          $msix = @(Get-ChildItem $output -Recurse -Filter '*.msix' -File) | Select-Object -First 1
          if (-not $msix) {
            throw 'Playback integration MSIX was not produced.'
          }

          "PLAYBACK_MSIX=$($msix.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify LibVLC payload inside MSIX
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $archive = [System.IO.Compression.ZipFile]::OpenRead($env:PLAYBACK_MSIX)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)

            foreach ($name in @('libvlc.dll', 'libvlccore.dll')) {
              if (-not ($entries | Where-Object { $_ -match "(^|[\\/])$([regex]::Escape($name))$" })) {
                throw "MSIX does not contain $name"
              }
            }

            $pluginEntries = @($entries | Where-Object {
              $_ -match '(^|[\\/])plugins[\\/].+\.dll$'
            })

            if ($pluginEntries.Count -eq 0) {
              throw 'MSIX does not contain LibVLC plugin DLLs.'
            }

            Write-Host "MSIX LibVLC payload PASS. Plugins=$($pluginEntries.Count)"
          }
          finally {
            $archive.Dispose()
          }

      - name: Build signed player volume/theme acceptance package
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: ./scripts/Build-PlayerVolumeThemeAcceptance.ps1

      - name: Upload signed player volume/theme installation package
        uses: actions/upload-artifact@v7
        with:
          name: Eizo-v0.2.0-player-volume-theme-signed
          path: |
            ${{ env.SIGNED_MSIX }}
            ${{ env.CERTIFICATE_PATH }}
            ${{ env.SHA256_PATH }}
          if-no-files-found: error
          retention-days: 14
