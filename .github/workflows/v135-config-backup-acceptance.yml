name: v135-config-backup-acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/Test-EikuraBrandV135Contract.ps1'
      - 'src/Eizo.App/ConfigBackupService.cs'
      - 'src/Eizo.App/Views/SettingsView.ConfigBackup.cs'
      - 'src/Eizo.App/Views/SettingsView.xaml.cs'
      - 'src/Eizo.App/ConfigBackupCodec.cs'
      - 'src/Eizo.App/ConfigBackupException.cs'
      - 'tests/Eizo.ConfigBackup.Tests/**'
  pull_request:
    paths:
      - 'scripts/Test-EikuraBrandV135Contract.ps1'
      - 'src/Eizo.App/ConfigBackupService.cs'
      - 'src/Eizo.App/Views/SettingsView.ConfigBackup.cs'
      - 'src/Eizo.App/Views/SettingsView.xaml.cs'
      - 'src/Eizo.App/ConfigBackupCodec.cs'
      - 'src/Eizo.App/ConfigBackupException.cs'
      - 'tests/Eizo.ConfigBackup.Tests/**'

jobs:
  acceptance:
    name: Validate Eikura 1.3.5 / 1.3.5.0 configuration backup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Eikura v1.3.5 acceptance
        shell: pwsh
        run: ./scripts/Test-EikuraBrandV135Contract.ps1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test WebDAV-password backup encryption
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .packages/Eizo.Playback -Force | Out-Null
          dotnet run --project tests/Eizo.ConfigBackup.Tests/Eizo.ConfigBackup.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Configuration backup tests failed.' }
